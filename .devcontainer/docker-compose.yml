# Containers do Codespace (usado pelo devcontainer.json)
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached     # a pasta do repositório fica em /workspaces/<nome-do-repo>
    command: sleep infinity          # mantém o container ligado; o servidor é iniciado pelo iniciar.sh
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-dev-codespaces   # só para este ambiente de testes
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Executados em ordem, só na PRIMEIRA vez que o banco é criado:
      - ../banco/radiance_banco.sql:/docker-entrypoint-initdb.d/01-radiance_banco.sql:ro
      - ./mysql-init/02-usuario.sql:/docker-entrypoint-initdb.d/02-usuario.sql:ro
      - ../banco/dados_teste.sql:/docker-entrypoint-initdb.d/03-dados_teste.sql:ro   # contas de teste (só desenvolvimento)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-dev-codespaces"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  mysql-data:   # os dados do banco ficam guardados enquanto o Codespace existir
